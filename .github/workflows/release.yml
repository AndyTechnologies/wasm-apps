name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.6.0)'
        required: true

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "❌ La versión '$VERSION' no cumple X.Y.Z"
              exit 1
            fi
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "✅ Workflow manual: versión $VERSION"
          else
            TAG="${{ github.ref_name }}"
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "❌ El tag '$TAG' no cumple vX.Y.Z"
              exit 1
            fi
            VERSION="${TAG#v}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "✅ Tag válido: $TAG → versión $VERSION"
          fi

      - name: Verify CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.sha }}"
          echo "Verificando CI en commit $SHA..."
          CONCLUSION=$(gh run list --commit "$SHA" --workflow "CI" \
            --json conclusion --jq '.[0].conclusion // "pending"' --limit 1)
          if [ "$CONCLUSION" != "success" ]; then
            echo "❌ CI no pasó para este commit (conclusion=$CONCLUSION)"
            exit 1
          fi
          echo "✅ CI pasó correctamente"

      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install & Build
        run: |
          pnpm install --no-frozen-lockfile
          pnpm -r build

      - name: Set version from tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for pkg in packages/*/; do
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('${pkg}package.json'));
              p.version = '$VERSION';
              fs.writeFileSync('${pkg}package.json', JSON.stringify(p, null, 2) + '\n');
            "
          done
          echo "✅ Versión $VERSION seteada en todos los packages"

      - name: Publish to npm
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for pkg in packages/*/; do
            NAME=$(node -p "require('./${pkg}package.json').name")
            echo "📦 Publicando $NAME@$VERSION ..."
            (cd "$pkg" && pnpm publish --no-git-checks --provenance --access public)
            echo "✅ Publicado $NAME@$VERSION"
          done
          echo "✅ Todos los packages publicados"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes \
            --target "${{ github.sha }}"
          echo "✅ GitHub Release v$VERSION creada"
